<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Title Image Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&family=Montserrat:wght@800&family=Playfair+Display:wght@800&family=Oswald:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f4f7;--card:#fff;--ink:#1b1e27;--mut:#667085;--line:#d9dde5;--acc:#2f5bea}
@media (prefers-color-scheme:dark){:root{--bg:#14161c;--card:#1d2029;--ink:#eef0f5;--mut:#9aa3b5;--line:#313644;--acc:#6d8cff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,Arial,sans-serif;padding:14px}
.wrap{max-width:760px;margin:0 auto;display:grid;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
h1{font-size:20px;margin:0 0 2px}
.sub{color:var(--mut);font-size:14px;margin:0}
textarea,input[type=text],select{width:100%;font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:8px;padding:10px}
textarea{min-height:90px;resize:vertical}
label{font-size:14px;color:var(--mut);display:block;margin-bottom:4px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.canvas-box{max-width:420px;margin:0 auto;border-radius:10px;overflow:hidden;line-height:0;border:1px solid var(--line)}
canvas{width:100%;height:auto;display:block}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font:inherit;font-weight:600;padding:12px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.info{display:flex;justify-content:space-between;font-size:14px;color:var(--mut);margin:0 0 8px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink);margin-top:8px}
.chk input{width:18px;height:18px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Title Image Maker</h1>
    <p class="sub">Paste your blog post title, download the image, and post it on Facebook or Pinterest.</p>
  </div>

  <div class="card">
    <label for="title">Blog post title</label>
    <textarea id="title" placeholder="Paste your blog post title here"></textarea>
    <div class="row" style="margin-top:10px">
      <div><label for="ratio">Image size</label>
        <select id="ratio"><option value="4:5">4:5 (1600x2000) Facebook + Pinterest</option><option value="2:3">2:3 (1600x2400) Pinterest first</option></select></div>
      <div><label for="font">Font</label>
        <select id="font">
          <option value="Poppins">Poppins</option>
          <option value="Montserrat">Montserrat</option>
          <option value="Playfair Display">Playfair Display</option>
          <option value="Oswald">Oswald</option>
        </select></div>
    </div>
    <div class="row" style="margin-top:10px">
      <div><label for="case">Text style</label>
        <select id="case"><option value="title">Title Case</option><option value="upper">UPPERCASE</option><option value="asis">As typed</option></select></div>
      <div><label for="align">Alignment</label>
        <select id="align"><option value="center">Center</option><option value="left">Left</option></select></div>
    </div>
    <div class="row" style="margin-top:10px">
      <div><label for="size">Font size: <span id="sizeV">Auto</span></label>
        <input type="range" id="size" min="40" max="300" value="150"></div>
      <div><label for="site">Site name (optional)</label>
        <input type="text" id="site" placeholder="example.com"></div>
    </div>
    <label class="chk"><input type="checkbox" id="auto" checked> Auto-fit text size</label>
    <label class="chk"><input type="checkbox" id="adv" checked> Switch to the next background after download</label>
  </div>

  <div class="card">
    <div class="info"><span id="counter"></span><span id="bgid"></span></div>
    <div class="canvas-box"><canvas id="cv" width="1600" height="2000"></canvas></div>
    <div class="btns" style="margin-top:10px">
      <button id="prev">Previous background</button>
      <button id="next">Next background</button>
      <button id="dlp" class="p">Download PNG</button>
      <button id="dlj" class="p">Download JPG</button>
    </div>
    <div class="btns" style="margin-top:8px;grid-template-columns:1fr">
      <button id="reset">Reset shuffle</button>
    </div>
  </div>
</div>

<script>
(function(){
let W=1600,H=2000;const N=1200,KEY='titleimg_shuffle_v1',RK='titleimg_ratio_v1';
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
function setRatio(v){H=v==='2:3'?2400:2000;cv.height=H}
let rv='4:5';try{rv=localStorage.getItem(RK)||'4:5'}catch(e){}
if(rv!=='2:3')rv='4:5';$('ratio').value=rv;setRatio(rv);

/* ---------- shuffle state (saved in browser) ---------- */
function shuffle(){const a=Array.from({length:N},(_,i)=>i);for(let i=N-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
if(!S||!Array.isArray(S.order)||S.order.length!==N||S.pos<0||S.pos>=N){S={order:shuffle(),pos:0,round:1}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function next(){S.pos++;if(S.pos>=N){const last=S.order[N-1];S.order=shuffle();if(S.order[0]===last){[S.order[0],S.order[1]]=[S.order[1],S.order[0]]}S.pos=0;S.round++}save()}
function prev(){if(S.pos>0){S.pos--;save()}}

/* ---------- clean backgrounds ---------- */
function mb(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
/* [bg start, bg end, accent, text color] */
const LIGHT=[['#ffffff','#f5f6f8','#2f5bea','#111827'],['#faf7f2','#f3ede3','#c2703d','#2b2118'],['#f4f6f8','#e9edf2','#5b6b82','#101828'],['#f1f7fd','#e3eff9','#3b82c4','#0f2238'],['#f2f9f4','#e2f1e7','#3f9b6b','#10281b'],['#fdf3f4','#f9e4e7','#d6566f','#2b0f16'],['#fbf6e9','#f6ecd0','#c99a1e','#2a2208'],['#f6f3fb','#ebe5f6','#7c5cc4','#1c1233'],['#fff5ee','#ffe8d9','#e8773a','#2d1608'],['#f0f8f7','#dff0ee','#2a9d8f','#0c2523'],['#f7f7f2','#eeeee4','#8a8f3a','#1f210c'],['#fafafa','#f0f0f0','#e03a3a','#141414']];
const DARK=[['#111827','#1b2437','#60a5fa','#ffffff'],['#1c1c1e','#2a2a2e','#f5b942','#ffffff'],['#0f2a20','#173b2e','#58c28a','#ffffff'],['#3a1018','#4d1a25','#f28a9b','#ffffff'],['#1e1b3a','#2c2750','#a78bfa','#ffffff'],['#0f2f33','#174247','#5eead4','#ffffff']];
function drawBg(idx){
  const r=mb(idx*7919+12345),type=idx%9,dk=r()<.3,L=dk?DARK:LIGHT,p=L[r()*L.length|0];
  const rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)),col=(c,al)=>`rgba(${c[0]},${c[1]},${c[2]},${al})`;
  const a=rgb(p[0]),b=rgb(p[1]),ac=rgb(p[2]);
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetY=0;
  const ang=Math.PI/2+(r()-.5)*1.4,l=Math.hypot(W,H)/2,x=Math.cos(ang)*l,y=Math.sin(ang)*l,g=ctx.createLinearGradient(W/2-x,H/2-y,W/2+x,H/2+y);
  g.addColorStop(0,col(a,1));g.addColorStop(1,col(b,1));ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const fl=r()<.5,top=r()<.5;ctx.fillStyle=col(ac,.9);ctx.strokeStyle=col(ac,.6);ctx.lineWidth=4;ctx.lineCap='round';
  if(type===1){const t=14+r()*14;ctx.fillRect(0,fl?0:H-t,W,t)}
  else if(type===2){const t=16+r()*14;ctx.fillRect(fl?0:W-t,0,t,H)}
  else if(type===3){const m=50+r()*30;ctx.strokeRect(m,m,W-2*m,H-2*m)}
  else if(type===4){ctx.fillStyle=col(ac,.14);ctx.beginPath();ctx.arc(fl?0:W,top?0:H,W*(.2+r()*.1),0,6.283);ctx.fill()}
  else if(type===5){ctx.fillStyle=col(ac,.12);const R=W*(.18+r()*.08);ctx.beginPath();ctx.arc(fl?0:W,0,R,0,6.283);ctx.fill();ctx.beginPath();ctx.arc(fl?W:0,H,R,0,6.283);ctx.fill()}
  else if(type===6){ctx.beginPath();ctx.moveTo(140,110);ctx.lineTo(W-140,110);ctx.moveTo(140,H-110);ctx.lineTo(W-140,H-110);ctx.stroke()}
  else if(type===7){const w=W*(.05+r()*.03);ctx.fillStyle=col(ac,.12);ctx.fillRect(fl?0:W-w,0,w,H)}
  else if(type===8){ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(90,210);ctx.lineTo(90,90);ctx.lineTo(210,90);ctx.moveTo(W-90,H-210);ctx.lineTo(W-90,H-90);ctx.lineTo(W-210,H-90);ctx.stroke()}
  return p[3];
}

/* ---------- text ---------- */
const FALL={'Poppins':'"Poppins"','Montserrat':'"Montserrat"','Playfair Display':'"Playfair Display"','Oswald':'"Oswald"'};
function family(){return (FALL[$('font').value]||'"Poppins"')+',"Segoe UI",Arial,sans-serif'}
function wrap(text,maxW){const out=[];
  text.split(/\n/).forEach(p=>{const words=p.trim().split(/\s+/).filter(Boolean);let line='';
    words.forEach(w=>{const t=line?line+' '+w:w;if(ctx.measureText(t).width>maxW&&line){out.push(line);line=w}else line=t});
    if(line)out.push(line)});return out}
function lumOf(){const t=document.createElement('canvas');t.width=40;t.height=30;const c=t.getContext('2d');
  c.drawImage(cv,W*.12,H*.25,W*.76,H*.5,0,0,40,30);const d=c.getImageData(0,0,40,30).data;let s=0;
  for(let i=0;i<d.length;i+=4)s+=(.2126*d[i]+.7152*d[i+1]+.0722*d[i+2])/255;return s/(d.length/4)}

let token=0;
async function render(){
  const my=++token,idx=S.order[S.pos];let text=$('title').value.trim();const tc=$('case').value;
  if(tc==='upper')text=text.toUpperCase();else if(tc==='title')text=text.replace(/(^|[\s\-:(])([a-z])/g,(m,a,b)=>a+b.toUpperCase());
  try{await document.fonts.load('700 60px '+family(),text||'A')}catch(e){}
  if(my!==token)return;
  const fg=drawBg(idx);
  const al=$('align').value,maxW=1240,maxH=1400,auto=$('auto').checked,has=!!text;
  $('dlp').disabled=$('dlj').disabled=!has;
  let size=auto?260:+$('size').value,lines=[],lh;
  for(;;){ctx.font=`700 ${size}px ${family()}`;lines=wrap(text||' ',maxW);lh=size*1.3;
    if(!auto||lines.length*lh<=maxH||size<=36)break;size-=4}
  $('sizeV').textContent=auto?'Auto ('+size+')':size;
  ctx.fillStyle=fg;ctx.textBaseline='middle';ctx.textAlign=al;
  const x=al==='center'?W/2:180,total=lines.length*lh,y0=(H-total)/2+lh/2-(lines.length?22:0);
  
  lines.forEach((l,i)=>ctx.fillText(l,x,y0+i*lh));
  ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetY=0;
  const by=y0+total-lh/2+lh*.5+30,bw=150;
  if(has){ctx.globalAlpha=.85;ctx.fillRect(al==='center'?W/2-bw/2:180,Math.min(by,H-150),bw,8);ctx.globalAlpha=1}
  const site=$('site').value.trim();
  if(site){ctx.font=`700 36px ${family()}`;ctx.globalAlpha=.8;ctx.textAlign='center';ctx.fillText(site,W/2,H-70);ctx.globalAlpha=1}
  $('counter').textContent=`${S.pos+1} / ${N} · Round ${S.round}`;$('bgid').textContent='BG #'+(idx+1);
}

/* ---------- download ---------- */
const CAP=window.Capacitor,NATIVE=!!(CAP&&CAP.isNativePlatform&&CAP.isNativePlatform());
async function shareNative(type){
  const P=CAP.Plugins,ext=type==='image/png'?'png':'jpg',name='post-image-'+(S.order[S.pos]+1)+'-'+Date.now()+'.'+ext;
  const data=cv.toDataURL(type,.93).split(',')[1];
  const w=await P.Filesystem.writeFile({path:name,data:data,directory:'CACHE'});
  await P.Share.share({title:'Post image',files:[w.uri],dialogTitle:'Share image'});
}
function download(type){
  if(NATIVE){shareNative(type).then(()=>{if($('adv').checked){next();render()}}).catch(e=>{const m=String(e&&e.message||e);if(!/cancel/i.test(m))alert('Share failed: '+m)});return}
  const ext=type==='image/png'?'png':'jpg';
  cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);
    a.download='post-image-'+(S.order[S.pos]+1)+'.'+ext;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),2000);
    if($('adv').checked){next();render()}},type,.93);
}

/* ---------- events ---------- */
let tm;const deb=()=>{clearTimeout(tm);tm=setTimeout(render,200)};
['title','site'].forEach(i=>$(i).addEventListener('input',deb));
['font','align','auto','case'].forEach(i=>$(i).addEventListener('change',render));
$('size').addEventListener('input',()=>{$('auto').checked=false;deb()});
$('ratio').addEventListener('change',()=>{rv=$('ratio').value;try{localStorage.setItem(RK,rv)}catch(e){}setRatio(rv);render()});
$('next').onclick=()=>{next();render()};
$('prev').onclick=()=>{prev();render()};
$('dlp').onclick=()=>download('image/png');
$('dlj').onclick=()=>download('image/jpeg');
$('reset').onclick=()=>{if(confirm('Reset the shuffle? All 1200 backgrounds will be shuffled again from the start.')){S={order:shuffle(),pos:0,round:1};save();render()}};
if(NATIVE){$('dlp').textContent='Share / Save PNG';$('dlj').textContent='Share / Save JPG'}
document.fonts.ready.then(render);render();
})();
</script>
</body>
</html>
